const STOPWORDS = new Set([
    "de","la","el","en","y","a","los","las","un","una",

]);
function normalizar(texto){

    return (texto || "")
        .toString()
        .toLowerCase()
        .trim()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/\s+/g," ");
}

// =====================================
// FECHA ROBUSTA
// Acepta fechas ISO y fechas guardadas como
// YYYY-M-D HH:mm / YYYY-MM-DD HH:mm sin zona horaria.
// =====================================
function parseFechaRobusta(valor){
    if(valor instanceof Date){
        return isNaN(valor.getTime()) ? null : valor;
    }

    if(valor === null || valor === undefined || valor === "") return null;

    const texto = String(valor).trim();

    // Formato sin zona horaria: YYYY-M-D HH:mm[:ss]
    // Se interpreta en la zona horaria local del equipo.
    const m = texto.match(/^(\d{4})-(\d{1,2})-(\d{1,2})[ T](\d{1,2}):(\d{2})(?::(\d{2})(?:\.(\d+))?)?$/);
    if(m){
        const anio = Number(m[1]);
        const mes = Number(m[2]);
        const dia = Number(m[3]);
        const hora = Number(m[4]);
        const minuto = Number(m[5]);
        const segundo = Number(m[6] || 0);
        const fecha = new Date(anio, mes - 1, dia, hora, minuto, segundo, 0);

        if(
            fecha.getFullYear() === anio &&
            fecha.getMonth() === mes - 1 &&
            fecha.getDate() === dia &&
            fecha.getHours() === hora &&
            fecha.getMinutes() === minuto
        ){
            return fecha;
        }
        return null;
    }

    // ISO con Z o desplazamiento horario.
    const fecha = new Date(texto);
    return isNaN(fecha.getTime()) ? null : fecha;
}

function formatoFechaMinuto(valor){
    const d = parseFechaRobusta(valor);
    if(!d) return null;

    return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()} ${d.getHours()}:${d.getMinutes()}`;
}
function embedding(texto){

    const words = normalizar(texto).split(" ");

    const map = {};

    for(let w of words){

        if(!map[w]) map[w] = 0;

        map[w] += 1;
    }

    return map;
}
function expandirSiglas(texto){

    if(!texto) return "";

    let t = texto.toLowerCase();

    // detecta siglas tipo SMM, VFD, PLC
    const siglas = t.match(/\b[a-z]{2,10}\b/gi) || [];

    siglas.forEach(sigla => {

        // intenta expandir por contexto (heurística)
        const expansion = heuristicaSigla(sigla);

        if(expansion){
            const regex = new RegExp(`\\b${sigla}\\b`, "g");
            t = t.replace(regex, expansion);
        }
    });

    return t;
}
function heuristicaSigla(sigla){

    const map = {
        "smm": "motor module system",
        "vfd": "variable frequency drive",
        "plc": "programmable logic controller",
        "hmi": "human machine interface"
    };

    return map[sigla.toLowerCase()] || null;
}
function similitudIA(a, b){

    const A = embedding(a);
    const B = embedding(b);

    let dot = 0;
    let magA = 0;
    let magB = 0;

    const keys = new Set([...Object.keys(A), ...Object.keys(B)]);

    keys.forEach(k => {

        const va = A[k] || 0;
        const vb = B[k] || 0;

        dot += va * vb;
        magA += va * va;
        magB += vb * vb;
    });

    if(magA === 0 || magB === 0) return 0;

    return dot / (Math.sqrt(magA) * Math.sqrt(magB));
}
function respuestaIA(usuario, correcta){

    usuario = normalizar(expandirSiglas(usuario));
    correcta = normalizar(expandirSiglas(correcta));

    if(!usuario || !correcta) return 0;

    // Exactamente iguales
    if(usuario === correcta) return 1;

    // se considera correcta.
    if(usuario.includes(correcta) || correcta.includes(usuario)) return 1;

    // Comparación por palabras:
    // la coincidencia mínima de UNA palabra significativa
    // ya es suficiente para marcar como correcta.
    const palabrasUsuario = usuario
        .split(/\s+/)
        .filter(w => w.length > 2 && !STOPWORDS.has(w));

    const palabrasCorrecta = correcta
        .split(/\s+/)
        .filter(w => w.length > 2 && !STOPWORDS.has(w));

    for(const palabraUsuario of palabrasUsuario){
        for(const palabraCorrecta of palabrasCorrecta){

            if(
                palabraUsuario === palabraCorrecta ||
                palabraUsuario.includes(palabraCorrecta) ||
                palabraCorrecta.includes(palabraUsuario) ||
                levenshtein(palabraUsuario, palabraCorrecta) <= 2
            ){
                return 1;
            }
        }
    }

    // No hubo ni siquiera una coincidencia mínima.
    return 0;
}

async function cargarIntentos() {

    const usuario =
    document.getElementById("selectUsuario")
    .value
    .trim();

    const select =
    document.getElementById("selectIntento");

    const contenedor =
    document.getElementById("contenedorPreguntas");

    contenedor.innerHTML = "";

    if (!usuario) {
        select.innerHTML = "<option value=''>Seleccione un técnico</option>";
        return;
    }

    select.innerHTML = "<option value=''>Cargando intentos...</option>";

    try {

        const { data, error } =
        await supabaseClient
            .from("resultados_test_tecnico")
            .select("fecha")
            .eq("usuario", usuario);

        if (error) throw error;

        const intentosMap = new Map();

        (data || []).forEach(row => {
            const formato = formatoFechaMinuto(row.fecha);

            // Si una fecha no puede interpretarse, no se crea un intento vacío.
            if (!formato) return;

            if (!intentosMap.has(formato)) {
                intentosMap.set(formato, row.fecha);
            }
        });

        const fechasUnicas = [...intentosMap.keys()].sort((a,b) => {
            const da = parseFechaRobusta(a);
            const db = parseFechaRobusta(b);
            return (db?.getTime() || 0) - (da?.getTime() || 0);
        });

        select.innerHTML =
        "<option value=''>Seleccione un intento</option>";

        fechasUnicas.forEach(f => {
            const option = document.createElement("option");
            option.value = f;
            option.textContent = f;
            select.appendChild(option);
        });

        if (fechasUnicas.length === 0) {
            select.innerHTML =
            "<option value=''>No hay intentos disponibles</option>";
            return;
        }

        // Si solo existe un intento, se selecciona automáticamente.
        // Si el navegador restauró una selección previa, también se respeta.
        const valorRestaurado = select.value;
        if (valorRestaurado && fechasUnicas.includes(valorRestaurado)) {
            select.value = valorRestaurado;
            cargarPreguntas();
        } else if (fechasUnicas.length === 1) {
            select.value = fechasUnicas[0];
            cargarPreguntas();
        }

        console.log("Intentos reales:", fechasUnicas);

    } catch (err) {
        console.error("Error al cargar intentos:", err);
        select.innerHTML =
        "<option value=''>Error al cargar intentos</option>";
        contenedor.innerHTML =
        "<div class='card'>No fue posible cargar los intentos de este técnico. Revisa la consola para más detalle.</div>";
    }
}

// =====================================

async function cargarPreguntas(){

    const usuario =
    document.getElementById("selectUsuario").value;

    const intento =
    document.getElementById("selectIntento").value;

    const contenedor =
    document.getElementById("contenedorPreguntas");

    if(!usuario || !intento){
        contenedor.innerHTML = "";
        return;
    }

    contenedor.innerHTML = "Cargando evaluación...";

    try{

        // ====================================
        // RESPUESTAS DEL USUARIO
        // ====================================

        const { data: respuestasUsuario, error: err1 } =
        await supabaseClient
        .from("resultados_test_tecnico")
        .select("*")
        .eq("usuario", usuario);

        if(err1) throw err1;

        // ====================================
        // FILTRAR INTENTO
        // Se hace antes de consultar las tablas auxiliares para que
        // un problema en la información de componentes no impida
        // cargar una evaluación que ya existe.
        // ====================================

        datosActuales = respuestasUsuario.filter(x => {
            const formato = formatoFechaMinuto(x.fecha);
            return formato === intento;
        });

        // Evitar mostrar la misma pregunta más de una vez en el mismo intento.
        // Se conserva únicamente la primera respuesta registrada para cada
        // pregunta normalizada. El resto del código y la información original
        // permanecen sin cambios.
        const preguntasVistas = new Set();
        datosActuales = datosActuales.filter(item => {
            const clavePregunta = normalizar(item.pregunta || "");

            if(!clavePregunta){
                return true;
            }

            if(preguntasVistas.has(clavePregunta)){
                return false;
            }

            preguntasVistas.add(clavePregunta);
            return true;
        });

        if(datosActuales.length === 0){
            contenedor.innerHTML =
            "No hay preguntas para este intento";
            return;
        }

        // ====================================
        // TABLA TEST_VAL
        // Pregunta -> Codigo
        // Esta es la tabla de donde el test
        // obtiene realmente las preguntas.
        // ====================================

        let bancoTest = [];
        try {
            const { data, error } =
            await supabaseClient
            .from("Test_val")
            .select("*");

            if(error) throw error;
            bancoTest = data || [];
        } catch(err3) {
            console.error("No se pudo cargar Test_val para relacionar componentes:", err3);
            bancoTest = [];
        }

        // ====================================
        // TABLA PTACTUAL
        // Codigo RH -> Componente + Puntaje de actividad
        // ====================================

        datosPTActual = [];
        try {
            const { data, error } =
            await supabaseClient
            .from("PTACTUAL")
            .select("*");

            if(error) throw error;
            datosPTActual = data || [];
        } catch(err4) {
            console.error("No se pudo cargar PTACTUAL para relacionar componentes:", err4);
            datosPTActual = [];
        }

        const mapaComponentes = {};

        (datosPTActual || []).forEach(registro => {
            const codigo = String(registro["Codigo RH"] || "").trim();

            if(codigo){
                const valorPuntaje = Number(
                    String(registro["Puntaje de actividad"] ?? "")
                        .replace(",", ".")
                );

                mapaComponentes[codigo] = {
                    componente: registro.Componente || "Sin componente",
                    puntaje: Number.isFinite(valorPuntaje) ? valorPuntaje : 0,
                    descripcionTarea: registro["Descripcion de Tarea"] || ""
                };
            }
        });

        // Pregunta utilizada en el test -> Codigo real de Test_val.
        // La relación se realiza directamente con Test_val para
        // determinar pregunta y Codigo.
        const mapaPreguntaCodigo = {};

        (bancoTest || []).forEach(registro => {
            const pregunta = normalizar(registro.Preguntas);
            const codigo = String(registro.Codigo || "").trim();

            if(!pregunta || !codigo) return;

            if(!mapaPreguntaCodigo[pregunta]){
                mapaPreguntaCodigo[pregunta] = [];
            }

            if(!mapaPreguntaCodigo[pregunta].includes(codigo)){
                mapaPreguntaCodigo[pregunta].push(codigo);
            }
        });

        let html = `
        <div class="card">
            <h3>Resultado Evaluación</h3>
            <button type="button" class="btnIA" onclick="analizarEvaluacionConIA()">Analizar respuestas</button>
        `;

        // ====================================
        // AGRUPAR POR COMPONENTE
        //
        // 1. Se busca la pregunta en Test_val.
        // 2. De esa pregunta se obtiene Codigo.
        // 3. Ese Codigo se compara con Codigo RH de PTACTUAL.
        // 4. De PTACTUAL se obtiene Componente.
        // ====================================

        const gruposComponentes = {};
        const ordenComponentes = [];

        datosActuales.forEach((item,index)=>{

            const preguntaUsuario =
            normalizar(item.pregunta);

            const respuestaUsuario =
            normalizar(item.respuesta);

            // Buscar la pregunta directamente en Test_val para
            // obtener Codigo y respuesta correcta.
            const coincidencias =
            bancoTest.filter(q =>
                normalizar(q.Preguntas) === preguntaUsuario
            );

            // El código para el COMPONENTE se obtiene de Test_val,
            // porque esa es la tabla que realmente alimenta el test.
            const codigosTest = mapaPreguntaCodigo[preguntaUsuario] || [];

            let preguntaEncontrada = null;

            // Si el registro de resultados ya trae un código,
            // se respeta ese código para identificar la pregunta.
            const codigoDirecto = String(
                item.Codigo ||
                item.codigo ||
                item["Codigo RH"] ||
                item.codigo_rh ||
                ""
            ).trim();

            if(codigoDirecto){
                preguntaEncontrada = coincidencias.find(q =>
                    String(q.Codigo || "").trim() === codigoDirecto
                ) || null;
            }

            // Si no hay código directo y solo existe una coincidencia,
            // esa es la pregunta correspondiente.
            if(!preguntaEncontrada && coincidencias.length === 1){
                preguntaEncontrada = coincidencias[0];
            }

            // Si la pregunta aparece varias veces en el banco,
            // se intenta identificar el registro correcto comparando
            // la respuesta del usuario contra las respuestas correctas.
            if(!preguntaEncontrada && coincidencias.length > 1){

                let mejor = null;
                let mejorScore = -1;

                coincidencias.forEach(q => {

                    const respuestaBanco =
                    normalizar(q.Respuestas || "");

                    let score = 0;

                    if(respuestaUsuario && respuestaBanco){
                        score = respuestaSimilar(
                            respuestaUsuario,
                            respuestaBanco
                        );
                    }

                    if(score > mejorScore){
                        mejorScore = score;
                        mejor = q;
                    }
                });

                preguntaEncontrada = mejor;
            }

            let estado = "";
            let clase = "";
            let respuestaCorrecta = "";
            let codigoPregunta = "";
            let componentePregunta = "Sin componente";

            // ==============================
            // PREGUNTA NO EXISTE
            // ==============================

            if(!preguntaEncontrada){

                estado = "⚠ Pregunta no encontrada";
                clase = "check";

                item.estadoIA = "check";
            }

            // ==============================
            // COMPARAR RESPUESTA
            // ==============================

            else{

                respuestaCorrecta =
                preguntaEncontrada.Respuestas || "";

                // Datos que usará exclusivamente la evaluación con IA.
                item.preguntaIA = item.pregunta || "";
                item.respuestaCorrectaIA = respuestaCorrecta;

                // ESTE ES EL VÍNCULO CORRECTO PARA EL TEST:
                // Test_val.Preguntas
                //       ↓
                // Test_val.Codigo
                //       ↓
                // PTACTUAL.Codigo RH
                //       ↓
                // PTACTUAL.Componente
                //
                // Test_val se usa para la pregunta, Codigo y respuesta correcta.
                if(codigosTest.length === 1){
                    codigoPregunta = codigosTest[0];
                    const infoComponente =
                        mapaComponentes[codigoPregunta];

                    componentePregunta = infoComponente
                        ? infoComponente.componente
                        : "Sin componente";

                    item.puntajeActividad = infoComponente
                        ? infoComponente.puntaje
                        : 0;

                    item.descripcionTarea = infoComponente
                        ? infoComponente.descripcionTarea
                        : "";
                }
                else if(codigosTest.length > 1){
                    // Si el mismo texto existe con varios códigos en Test_val,
                    // no se asigna un componente arbitrario.
                    codigoPregunta = codigosTest.join(", ");
                    componentePregunta = "Sin componente (código ambiguo)";
                    item.puntajeActividad = 0;
                }

                item.codigoPregunta = codigoPregunta;
                item.componente = componentePregunta;

                const scoreRespuesta = respuestaIA(
                    respuestaUsuario,
                    respuestaCorrecta
                );

                if(scoreRespuesta === 1){

                    estado = "✔ Correcta";
                    clase = "correcta";

                    item.estadoIA = "correcta";
                }
                else{

                    estado = "✖ Incorrecta";
                    clase = "incorrecta";

                    item.estadoIA = "incorrecta";
                }
            }

            if(!item.componente){
                item.componente = componentePregunta;
            }

            if(!gruposComponentes[item.componente]){
                gruposComponentes[item.componente] = [];
                ordenComponentes.push(item.componente);
            }

            gruposComponentes[item.componente].push({
                item,
                index,
                respuestaCorrecta,
                clase
            });
        });

        // ====================================
        // MOSTRAR AGRUPADAS POR COMPONENTE
        // ====================================

        ordenComponentes.forEach(componente => {

            const preguntasComponente =
            gruposComponentes[componente];

            let buenas = 0;

            preguntasComponente.forEach(registro => {
                if(registro.item.estadoIA === "correcta"){
                    buenas++;
                }
            });

            html += `
                <details class="resultado-seccion preguntas-componente">
                    <summary>${componente} — ${buenas} buenas de ${preguntasComponente.length}</summary>
                    <div class="seccion-contenido">
            `;

            preguntasComponente.forEach(registro => {

                const item = registro.item;
                const index = registro.index;
                const respuestaCorrecta = registro.respuestaCorrecta;

                html += `
                <div class="pregunta">

                    <div>
                        <b>${index + 1}. ${item.pregunta}</b>
                    </div>

                    <br>

                    <div>
                        <b>Respuesta usuario:</b><br>
                        ${item.respuesta || "(Sin respuesta)"}
                    </div>

                    <br>

                    <div>
                        <b>Respuesta correcta:</b><br>
                        ${respuestaCorrecta || "No encontrada"}
                    </div>

                    <div id="ia_resultado_${index}" class="ia-resultado">Análisis: pendiente</div>

                    <br>

                    <div>

                        <label style="margin-right:20px;">
                            <input
                                type="radio"
                                name="val_${index}"
                                value="correcta"
                                ${item.estadoIA === "correcta" ? "checked" : ""}>
                            Correcta
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="val_${index}"
                                value="incorrecta"
                                ${item.estadoIA === "incorrecta" ? "checked" : ""}>
                           Incorrecta
                        </label>

                    </div>

                </div>
                `;
            });

            html += `</div></details>`;
        });

        html += "</div>";

        contenedor.innerHTML = html;

    }
    catch(err){

        console.error(err);

        contenedor.innerHTML =
        "Error al cargar evaluación";
    }
}


function similitudPregunta(a, b){

    if(!a || !b) return 0;

    a = normalizar(expandirSiglas(a));
    b = normalizar(expandirSiglas(b));

    if(a === b) return 1;

    const A = a.split(" ");
    const B = b.split(" ");

    let match = 0;

    for(let w of A){
        for(let v of B){

            if(
                w === v ||
                w.includes(v) ||
                v.includes(w) ||
                levenshtein(w, v) <= 2
            ){
                match++;
                break;
            }
        }
    }

    return match / Math.max(A.length, B.length);
}
function levenshtein(a, b){

    const matrix = Array.from({length: a.length+1}, () =>
        new Array(b.length+1).fill(0)
    );

    for(let i=0;i<=a.length;i++) matrix[i][0]=i;
    for(let j=0;j<=b.length;j++) matrix[0][j]=j;

    for(let i=1;i<=a.length;i++){
        for(let j=1;j<=b.length;j++){

            const cost = a[i-1] === b[j-1] ? 0 : 1;

            matrix[i][j] = Math.min(
                matrix[i-1][j] + 1,
                matrix[i][j-1] + 1,
                matrix[i-1][j-1] + cost
            );
        }
    }

    return matrix[a.length][b.length];
}
// Compatibilidad con la rutina de comparación de respuestas.
// La función respuestaSimilar puede utilizar similitudInteligente cuando
// una misma pregunta aparece más de una vez. Se mantiene la lógica existente
// usando la similitud por palabras ya definida en similitudIA.
function similitudInteligente(a, b){
    return similitudIA(a, b);
}

function respuestaSimilar(a, b){

    a = normalizar(a);
    b = normalizar(b);

    if(!a || !b) return 0;

    if(a === b) return 1;

    // contiene fuerte
    if(a.includes(b) || b.includes(a)) return 0.95;

    const sim = similitudInteligente(a, b);

    // 🔥 BONUS SEMÁNTICO:
    // si comparte al menos 1 palabra importante → ya cuenta
    if(sim > 0 && sim < 0.2){
        return 0.5;
    }

    return sim;
}
// =====================================
// EVALUACIÓN CON IA
// La IA analiza el significado de la respuesta del técnico
// contra la respuesta de referencia de Test_val.
// No se cambia ninguna otra lógica del cálculo existente.
// =====================================
async function evaluarRespuestaConIA(pregunta, respuestaCorrecta, respuestaUsuario){

    const endpointIA = `${supabaseUrl}/functions/v1/evaluar-respuesta-ia`;

    const respuesta = await fetch(endpointIA, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${supabaseKey}`
        },
        body: JSON.stringify({
            pregunta,
            respuesta_correcta: respuestaCorrecta,
            respuesta_usuario: respuestaUsuario
        })
    });

    const datos = await respuesta.json();

    if(!respuesta.ok){
        throw new Error(datos?.error || "No fue posible consultar la IA");
    }

    return datos;
}

async function analizarEvaluacionConIA(){
    const boton = document.querySelector(".btnIA");

    if(!datosActuales || datosActuales.length === 0){
        alert("No hay preguntas para analizar.");
        return;
    }

    if(boton){
        boton.disabled = true;
        boton.textContent = "Analizando respuestas...";
    }

    let correctas = 0;
    let incorrectas = 0;
    let revisar = 0;

    try{
        // Procesar una pregunta a la vez para respetar el límite RPM de OpenAI.
        for(let i = 0; i < datosActuales.length; i++){

            const item = datosActuales[i];
            const panel = document.getElementById(`ia_resultado_${i}`);

            if(panel){
                panel.innerHTML =
                    `Analizando ${i + 1} de ${datosActuales.length}...`;
            }

            const pregunta = item.preguntaIA || item.pregunta || "";
            const respuestaCorrecta = item.respuestaCorrectaIA || "";
            const respuestaUsuario = item.respuesta || "";

            let datosIA = null;
            let ultimoError = null;

            // Reintentar automáticamente si se alcanza el rate limit.
            for(let intento = 1; intento <= 4; intento++){
                try{
                    datosIA = await evaluarRespuestaConIA(
                        pregunta,
                        respuestaCorrecta,
                        respuestaUsuario
                    );
                    ultimoError = null;
                    break;
                }
                catch(errorPregunta){
                    ultimoError = errorPregunta;

                    const mensaje = String(
                        errorPregunta?.message || ""
                    ).toLowerCase();

                    const esRateLimit =
                        mensaje.includes("rate limit") ||
                        mensaje.includes("too many requests") ||
                        mensaje.includes("requests per min") ||
                        mensaje.includes("rpm") ||
                        mensaje.includes("429");

                    if(!esRateLimit || intento === 4){
                        break;
                    }

                    const espera =
                        intento === 1 ? 7000 :
                        intento === 2 ? 9000 :
                        12000;

                    if(panel){
                        panel.innerHTML =
                            `Límite de análisis alcanzado.<br>` +
                            `Esperando ${Math.round(espera / 1000)} segundos...`;
                    }

                    await new Promise(resolve =>
                        setTimeout(resolve, espera)
                    );
                }
            }

            if(!datosIA){
                if(panel){
                    panel.innerHTML =
                        `Análisis no disponible para esta pregunta<br>` +
                        `${ultimoError?.message || "Error al consultar la IA"}`;
                }
                continue;
            }

            const decision = String(datosIA.decision || "").toLowerCase();
            const confianza =
                datosIA.confianza !== undefined ? datosIA.confianza : "";
            const motivo =
                datosIA.motivo || "Sin explicación proporcionada.";

            if(decision === "correcta"){
                item.estadoIA = "correcta";
                correctas++;
            }else if(decision === "incorrecta"){
                item.estadoIA = "incorrecta";
                incorrectas++;
            }else{
                item.estadoIA = "revisar";
                revisar++;
            }

            const radioCorrecta =
                document.querySelector(
                    `input[name="val_${i}"][value="correcta"]`
                );
            const radioIncorrecta =
                document.querySelector(
                    `input[name="val_${i}"][value="incorrecta"]`
                );

            if(decision === "correcta" && radioCorrecta){
                radioCorrecta.checked = true;
            }else if(decision === "incorrecta" && radioIncorrecta){
                radioIncorrecta.checked = true;
            }

            if(panel){
                let icono = "🟡";
                let texto = "Revisar";

                if(decision === "correcta"){
                    icono = "🟢";
                    texto = "Correcta";
                }else if(decision === "incorrecta"){
                    icono = "🔴";
                    texto = "Incorrecta";
                }

                panel.innerHTML =
                    `${icono} <b>IA: ${texto}</b>` +
                    (confianza !== "" ? `<br>Confianza: ${confianza}%` : "") +
                    `<br>${motivo}`;
            }

            // Pausa entre preguntas para evitar ráfagas de solicitudes.
            if(i < datosActuales.length - 1){
                await new Promise(resolve =>
                    setTimeout(resolve, 6500)
                );
            }
        }

        if(typeof calcularResultado === "function"){
            await calcularResultado();
        }

        alert(
            `Análisis terminado.\n\n` +
            `Correctas: ${correctas}\n` +
            `Incorrectas: ${incorrectas}\n` +
            `Revisar: ${revisar}`
        );

    }catch(error){
        console.error("Error general al analizar con IA:", error);
        alert(
            "El análisis con IA se detuvo: " +
            (error?.message || "error desconocido")
        );
    }finally{
        if(boton){
            boton.disabled = false;
            boton.textContent = "Analizar respuestas";
        }
    }
}

// =====================================
// CALCULAR RESULTADO
// =====================================

async function calcularResultado(){

    let correctas = 0;
    let incorrectas = 0;

    datosActuales.forEach((item,index)=>{

        const seleccion =
        document.querySelector(
            `input[name="val_${index}"]:checked`
        );

        if(!seleccion) return;

        if(seleccion.value === "correcta"){
            correctas++;
        }
        else{
            incorrectas++;
        }

    });

    const total = correctas + incorrectas;

    const porcentaje =
    total > 0
        ? ((correctas / total) * 100).toFixed(1)
        : 0;

    // =====================================
    // CALIFICACION POR COMPONENTE
    //
    // Para cada pregunta se usa su Codigo real de Test_val,
    // se busca en PTACTUAL.Codigo RH y se toma: Componente +
    // Puntaje de actividad.
    // Si el componente obtiene 60% o más, recibe los puntos que
    // corresponden a las actividades de ese componente.
    // Se cuentan los codigos una sola vez para no duplicar
    // puntos cuando un mismo codigo tiene varias preguntas.
    // =====================================

    const resumenComponentes = {};
    const ordenResumen = [];

    datosActuales.forEach((item, index) => {

        const seleccion =
            document.querySelector(
                `input[name="val_${index}"]:checked`
            );

        const componente =
            item.componente || "Sin componente";

        if(!resumenComponentes[componente]){
            resumenComponentes[componente] = {
                buenas: 0,
                total: 0,
                actividades: {},
                descripciones: {}
            };
            ordenResumen.push(componente);
        }

        const grupo = resumenComponentes[componente];
        grupo.total++;

        if(seleccion && seleccion.value === "correcta"){
            grupo.buenas++;
        }

        const codigo = String(item.codigoPregunta || "").trim();
        const puntaje = Number(item.puntajeActividad || 0);

        // Un mismo codigo puede tener varias preguntas.
        // El puntaje de esa actividad se considera una sola vez.
        if(codigo && puntaje > 0 && !codigo.includes(",")){
            grupo.actividades[codigo] = puntaje;
        }

        const descripcion = String(item.descripcionTarea || "").trim();
        if(descripcion && codigo && !codigo.includes(",")){
            grupo.descripciones[codigo] = descripcion;
        }
    });

    let puntajeTotalPosible = 0;
    let puntajeTotalObtenido = 0;
    let htmlComponentes = `
        <div class="card">
            <details class="resultado-seccion">
                <summary>Calificación por componente</summary>
                <div class="seccion-contenido">
            <table style="width:100%;border-collapse:collapse;">
                <thead>
                    <tr>
                        <th style="text-align:left;padding:8px;border-bottom:1px solid #ddd;">Componente</th>
                        <th style="padding:8px;border-bottom:1px solid #ddd;">Buenas</th>
                        <th style="padding:8px;border-bottom:1px solid #ddd;">Calificación</th>
                        <th style="padding:8px;border-bottom:1px solid #ddd;">Puntos</th>
                    </tr>
                </thead>
                <tbody>
    `;

    ordenResumen.forEach(componente => {

        const grupo = resumenComponentes[componente];
        const porcentajeComponente =
            grupo.total > 0
                ? (grupo.buenas / grupo.total) * 100
                : 0;

        const puntosComponente =
            Object.values(grupo.actividades)
                .reduce((suma, valor) => suma + Number(valor || 0), 0);

        const puntosObtenidos =
            porcentajeComponente >= 60
                ? puntosComponente
                : 0;

        puntajeTotalPosible += puntosComponente;
        puntajeTotalObtenido += puntosObtenidos;

        htmlComponentes += `
            <tr>
                <td style="padding:8px;border-bottom:1px solid #eee;"><b>${componente}</b></td>
                <td style="padding:8px;text-align:center;border-bottom:1px solid #eee;">${grupo.buenas} de ${grupo.total}</td>
                <td style="padding:8px;text-align:center;border-bottom:1px solid #eee;">${porcentajeComponente.toFixed(1)}%</td>
                <td style="padding:8px;text-align:center;border-bottom:1px solid #eee;">${puntosObtenidos} / ${puntosComponente}</td>
            </tr>
        `;
    });

    let htmlTareasMenos60 = "";
    let puntosAdicionalesMenos60 = 0;
    const datosGraficaMejora = [];

    // Para componentes menores al 60%, mostrar SOLAMENTE las actividades
    // (Codigo RH) en las que el tecnico tuvo alguna respuesta incorrecta
    // o dejo alguna pregunta sin completar.
    // Una actividad cuenta como pendiente si NO todas sus preguntas fueron correctas.
    const actividadEvaluacion = {};

    datosActuales.forEach((item, index) => {
        const codigo = String(item.codigoPregunta || "").trim();
        const componente = String(item.componente || "Sin componente").trim();
        if(!codigo || codigo.includes(",")) return;

        const seleccion = document.querySelector(`input[name="val_${index}"]:checked`);
        const esCorrecta = !!seleccion && seleccion.value === "correcta";

        if(!actividadEvaluacion[codigo]){
            actividadEvaluacion[codigo] = {
                componente,
                totalPreguntas: 0,
                correctas: 0
            };
        }

        actividadEvaluacion[codigo].totalPreguntas++;
        if(esCorrecta){
            actividadEvaluacion[codigo].correctas++;
        }
    });

    // Buscar el puntaje de cada actividad directamente en PTACTUAL.
    const puntosPorCodigoPT = {};
    (datosPTActual || []).forEach(registro => {
        const codigo = String(registro["Codigo RH"] || "").trim();
        const componente = String(registro.Componente || "Sin componente").trim();
        const puntaje = Number(
            String(registro["Puntaje de actividad"] ?? "").replace(",", ".")
        );

        if(!codigo || !componente || !Number.isFinite(puntaje)) return;

        puntosPorCodigoPT[codigo] = { componente, puntaje };
    });

    ordenResumen.forEach(componente => {
        const grupo = resumenComponentes[componente];
        const porcentajeComponente =
            grupo.total > 0
                ? (grupo.buenas / grupo.total) * 100
                : 0;

        if(porcentajeComponente >= 60) return;

        const actividadesPendientes = [];

        Object.entries(actividadEvaluacion).forEach(([codigo, actividad]) => {
            if(actividad.componente !== componente) return;

            // La actividad requiere MEJORA si tuvo al menos una respuesta incorrecta
            // o si no todas sus preguntas fueron contestadas correctamente.
            if(actividad.correctas < actividad.totalPreguntas){
                const infoPT = puntosPorCodigoPT[codigo];
                if(infoPT){
                    const registroPT = (datosPTActual || []).find(r =>
                        String(r["Codigo RH"] || "").trim() === codigo
                    );
                    const descripcion = String(
                        registroPT?.["Descripcion de Tarea"] || ""
                    ).trim();

                    actividadesPendientes.push({
                        codigo,
                        puntaje: infoPT.puntaje,
                        descripcion,
                        preguntas: actividad.totalPreguntas,
                        correctas: actividad.correctas
                    });
                }
            }
        });

        if(actividadesPendientes.length > 0){
            const puntosFaltantesComponente = actividadesPendientes.reduce(
                (suma, actividad) => suma + Number(actividad.puntaje || 0),
                0
            );

            puntosAdicionalesMenos60 += puntosFaltantesComponente;
            datosGraficaMejora.push({
                componente,
                puntos: puntosFaltantesComponente,
                actividades: actividadesPendientes.length
            });

            htmlTareasMenos60 += `
                <details style="margin-top:8px;border:1px solid #ddd;border-radius:8px;background:#fff;">
                    <summary style="cursor:pointer;padding:10px;font-weight:700;list-style:none;">
                        ${componente} — ${porcentajeComponente.toFixed(1)}%
                        <span style="float:right;">${puntosFaltantesComponente} puntos a mejorar</span>
                    </summary>
                    <div style="padding:0 10px 10px;">
                        ${actividadesPendientes.map(a => `
                            <div style="margin-top:8px;padding:8px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:7px;">
                                <b>Mejorar: ${a.descripcion || "Actividad sin descripción"}</b>
                                <div style="font-size:12px;color:#666;margin-top:3px;">
                                    Código RH: ${a.codigo} · Preguntas correctas: ${a.correctas}/${a.preguntas} · Valor: ${a.puntaje} puntos
                                </div>
                            </div>
                        `).join("")}
                    </div>
                </details>
            `;
        }
    });

    let htmlGraficaMejora = "";
    if(datosGraficaMejora.length > 0){
        const totalGrafica = datosGraficaMejora.reduce(
            (suma, dato) => suma + Number(dato.puntos || 0),
            0
        );

        const coloresGrafica = [
            "#1d4ed8","#0f766e","#7c3aed","#b45309",
            "#be123c","#475569","#047857","#6d28d9"
        ];

        let acumulado = 0;
        const segmentos = datosGraficaMejora.map((dato, indice) => {
            const inicio = totalGrafica > 0
                ? (acumulado / totalGrafica) * 100
                : 0;
            acumulado += Number(dato.puntos || 0);
            const fin = totalGrafica > 0
                ? (acumulado / totalGrafica) * 100
                : 0;
            const color = coloresGrafica[indice % coloresGrafica.length];
            return { ...dato, color, inicio, fin };
        });

        const fondoPastel = segmentos
            .map(segmento => `${segmento.color} ${segmento.inicio.toFixed(2)}% ${segmento.fin.toFixed(2)}%`)
            .join(", ");

        htmlGraficaMejora = `
            <div class="grafica-mejora">
                <div class="grafica-mejora-titulo">Distribución de puntos por mejorar</div>
                <div class="grafica-mejora-subtitulo">
                    La gráfica muestra qué porcentaje de los puntos pendientes corresponde a cada componente.
                </div>
                <div class="grafica-mejora-contenido">
                    <div class="grafica-pastel" style="background:conic-gradient(${fondoPastel});">
                        <div class="grafica-centro">
                            <strong>${totalGrafica}</strong>
                            <span>puntos por mejorar</span>
                        </div>
                    </div>
                    <div class="grafica-leyenda">
                        ${segmentos.map(segmento => `
                            <div class="grafica-leyenda-item">
                                <span class="grafica-punto" style="background:${segmento.color};"></span>
                                <span class="grafica-leyenda-nombre">
                                    ${segmento.componente}
                                    <span style="display:block;color:#667085;font-size:11px;">
                                        ${segmento.actividades} actividad${segmento.actividades === 1 ? "" : "es"}
                                    </span>
                                </span>
                                <span class="grafica-leyenda-valor">
                                    ${segmento.puntos} pts · ${totalGrafica > 0 ? ((segmento.puntos / totalGrafica) * 100).toFixed(1) : "0.0"}%
                                </span>
                            </div>
                        `).join("")}
                    </div>
                </div>
            </div>
        `;
    }

    if(htmlTareasMenos60){
        htmlTareasMenos60 = `
            <details class="resultado-seccion">
                <summary>Componentes y actividades que debe mejorar</summary>
                <div class="seccion-contenido">
                    <span style="font-size:13px;color:#555;">Se muestran las actividades evaluadas que todavía tienen respuestas incorrectas o incompletas.</span>
                    ${htmlGraficaMejora}
                    ${htmlTareasMenos60}
                    <div style="margin-top:10px;padding:10px;background:#f9fafb;border:1px solid #ddd;border-radius:8px;">
                        <b>Total de puntos que faltan:</b> +${puntosAdicionalesMenos60}
                    </div>
                </div>
            </details>
        `;
    }

    // =====================================
    // ACTIVIDADES ASIGNADAS A ESTA PERSONA SIN PREGUNTA
    // Solo se revisan las filas de PTACTUAL que tienen valor 1
    // en la columna correspondiente al técnico seleccionado.
    // Después se compara el Codigo RH contra los códigos que sí
    // aparecen en la evaluación de esta persona.
    // =====================================
    const nombrePersonaPT = (document.getElementById("selectUsuario")?.value || "").trim();

    // Códigos que realmente aparecen en la evaluación seleccionada.
    const codigosEvaluados = new Set();
    (datosActuales || []).forEach(item => {
        const codigo = String(item.codigoPregunta || "").trim();
        if(codigo && !codigo.includes(",")) codigosEvaluados.add(codigo);
    });

    function encontrarColumnaPersonaPT(nombre, filas){
        if(!nombre || !filas || !filas.length) return null;

        const objetivo = normalizar(nombre).replace(/\s+/g, " ");
        const claves = Object.keys(filas[0] || {});

        // Primero: coincidencia exacta del nombre con el encabezado.
        let clave = claves.find(k => normalizar(k).replace(/\s+/g, " ") === objetivo);
        if(clave) return clave;

        // Segundo: comparación ignorando diferencias de espacios/puntuación.
        const compacto = objetivo.replace(/[^a-z0-9]/g, "");
        clave = claves.find(k => {
            const nk = normalizar(k).replace(/[^a-z0-9]/g, "");
            return nk === compacto && compacto.length > 5;
        });

        return clave || null;
    }

    const columnaPersonaPT = encontrarColumnaPersonaPT(nombrePersonaPT, datosPTActual || []);
    const actividadesSinPregunta = {};

    if(columnaPersonaPT){
        (datosPTActual || []).forEach(registro => {
            const valorPersona = registro[columnaPersonaPT];
            const esAsignada =
                valorPersona === 1 ||
                String(valorPersona ?? "").trim() === "1";

            if(!esAsignada) return;

            const codigo = String(registro["Codigo RH"] || "").trim();
            if(!codigo) return;

            // Si el código ya aparece en alguna pregunta de la evaluación,
            // esa actividad sí fue evaluada y no debe aparecer aquí.
            if(codigosEvaluados.has(codigo)) return;

            const componente = String(registro.Componente || "Sin componente").trim();
            const descripcion = String(registro["Descripcion de Tarea"] || "").trim();
            const puntaje = Number(
                String(registro["Puntaje de actividad"] ?? "").replace(",", ".")
            );

            if(!Number.isFinite(puntaje)) return;

            // Una actividad se muestra una sola vez por Codigo RH.
            if(!actividadesSinPregunta[codigo]){
                actividadesSinPregunta[codigo] = {
                    codigo,
                    componente,
                    descripcion,
                    puntaje
                };
            }
        });
    }

    const listaActividadesSinPregunta = Object.values(actividadesSinPregunta);
    const puntosSinPregunta = listaActividadesSinPregunta.reduce(
        (suma, actividad) => suma + Number(actividad.puntaje || 0),
        0
    );

    // PUNTAJE A COMPLETAR REAL:
    // se suma lo que el técnico YA obtuvo + los puntos de las
    // actividades que PTACTUAL marca con 1 pero que NO tienen
    // ninguna pregunta en la evaluación.
    // NO se suman nuevamente las actividades que sí tienen preguntas,
    // aunque hayan quedado incorrectas, porque esos puntos ya forman
    // parte de la evaluación y no deben duplicarse.
    const puntajeQueSaco = Number(puntajeTotalObtenido || 0);
    const puntajeQueFaltaSinPregunta = Number(puntosSinPregunta || 0);
    const puntajePotencialPersona =
        puntajeQueSaco + puntajeQueFaltaSinPregunta;

    let htmlActividadesSinPregunta = "";

    if(listaActividadesSinPregunta.length > 0){
        const gruposSinPregunta = {};
        listaActividadesSinPregunta.forEach(actividad => {
            if(!gruposSinPregunta[actividad.componente]) gruposSinPregunta[actividad.componente] = [];
            gruposSinPregunta[actividad.componente].push(actividad);
        });

        htmlActividadesSinPregunta = Object.entries(gruposSinPregunta).map(([componente, actividades]) => `
            <details style="margin-top:10px;border:1px solid #ddd;border-radius:8px;background:#fff;">
                <summary style="cursor:pointer;padding:10px;font-weight:700;list-style:none;">
                    ${componente} <span style="float:right;">${actividades.length} actividades</span>
                </summary>
                <div style="padding:0 10px 10px;">
                    ${actividades.map(actividad => `
                        <div style="margin-top:8px;padding:8px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:7px;">
                            <b>Aprender: ${actividad.descripcion || "Actividad sin descripción"}</b>
                            <span style="float:right;font-weight:bold;">+${actividad.puntaje} puntos</span>
                            <div style="font-size:12px;color:#666;margin-top:3px;">Código RH: ${actividad.codigo}</div>
                        </div>
                    `).join("")}
                </div>
            </details>
        `).join("");
    }

    const htmlSinPregunta = !columnaPersonaPT
        ? `
            <div style="margin-top:15px;padding:12px;background:#fff;border:1px solid #ddd;border-radius:8px;">
                <b>Actividades asignadas sin pregunta</b><br>
                No se encontró en PTACTUAL una columna que corresponda al técnico <b>${nombrePersonaPT}</b>.
            </div>
        `
        : listaActividadesSinPregunta.length > 0
        ? `
            <details class="resultado-seccion">
                <summary>Componentes y actividades que debe aprender</summary>
                <div class="seccion-contenido">
                    <div style="margin-bottom:8px;color:#555;">Solo se muestran las actividades marcadas con <b>1</b> para esta persona y cuyo código no aparece en la evaluación.</div>
                    ${htmlActividadesSinPregunta}
                    <div style="margin-top:10px;padding:10px;background:#f9fafb;border:1px solid #ddd;border-radius:8px;">
                        <b>Total de puntos que faltan por estas actividades:</b> +${puntosSinPregunta}
                    </div>
                </div>
            </details>
        `
        : `
            <div style="margin-top:15px;padding:12px;background:#fff;border:1px solid #ddd;border-radius:8px;">
                <b>Componentes y actividades que debe aprender</b><br>
                No se encontraron actividades marcadas con <b>1</b> que estén ausentes de la evaluación.
            </div>
        `;

    const porcentajePuntosTotal =
        puntajeTotalPosible > 0
            ? (puntajeTotalObtenido / puntajeTotalPosible) * 100
            : 0;

    // =====================================
    // COMPARAR PUNTAJE TOTAL VS PUNTAJE TECNICO
    // DE Datos_personales
    // Se busca por el nombre del tecnico seleccionado.
    // =====================================
    let htmlComparacionTecnico = `
        <div style="margin-top:15px;padding:12px;background:#fff;border:1px solid #ddd;border-radius:8px;">
            <b>Comparación con Datos_personales</b><br>
            <span>Cargando PUNTAJE TECNICO...</span>
        </div>
    `;

    try {
        const nombreTecnico = document.getElementById("selectUsuario")?.value || "";

        if(nombreTecnico){
            const { data: datosPersonales, error: errorDatosPersonales } =
                await supabaseClient
                    .from("Datos_personales")
                    .select("*")
                    .ilike("NOMBRE", `%${nombreTecnico}%`);

            if(errorDatosPersonales){
                console.error("Error Datos_personales:", errorDatosPersonales);
                htmlComparacionTecnico = `
                    <div style="margin-top:15px;padding:12px;background:#fff;border:1px solid #ddd;border-radius:8px;">
                        <b>Comparación con Datos_personales</b><br>
                        No fue posible consultar el PUNTAJE TECNICO.
                    </div>`;
            } else if(datosPersonales && datosPersonales.length > 0){
                const registro = datosPersonales[0];
                const puntajeTecnico = Number(registro["PUNTAJE TECNICO"] || 0);
                const diferencia = puntajeTotalObtenido - puntajeTecnico;
                const coincide = Math.abs(diferencia) < 0.0001;
                const faltanParaTecnico = Math.max(0, puntajeTecnico - puntajeTotalObtenido);

                // Puntos de las RESPUESTAS MALAS:
                // se suma una sola vez el puntaje de cada actividad que
                // tiene preguntas evaluadas y al menos una respuesta incorrecta.
                // Esto permite simular: Total + puntos de las respuestas malas.
                const actividadesConMalas = {};
                Object.entries(actividadEvaluacion).forEach(([codigo, actividad]) => {
                    if(actividad.correctas >= actividad.totalPreguntas) return;
                    const infoPT = puntosPorCodigoPT[codigo];
                    if(!infoPT) return;
                    actividadesConMalas[codigo] = Number(infoPT.puntaje || 0);
                });
                const puntosDeLasMalas = Object.values(actividadesConMalas)
                    .reduce((suma, valor) => suma + Number(valor || 0), 0);
                const puntajeSiLasMalasFueranBuenas = puntajePotencialPersona + puntosDeLasMalas;

                let estadoReal = "";
                if(coincide){
                    estadoReal = "✅ El puntaje calculado coincide con PUNTAJE TECNICO.";
                }else if(diferencia < 0){
                    estadoReal = `⚠️ Faltan ${faltanParaTecnico} puntos para alcanzar PUNTAJE TECNICO.`;
                }else{
                    estadoReal = `⚠️ El puntaje calculado supera PUNTAJE TECNICO por ${diferencia} puntos.`;
                }

                // Comparación final solicitada:
                // PUNTAJE TECNICO - (puntaje calculado + puntos de las respuestas malas)
                const comparacionRespuestasMalas = puntajePotencialPersona + puntosDeLasMalas;
                const diferenciaTecnicoVsMalas = puntajeTecnico - comparacionRespuestasMalas;
                const estadoComparacionMalas = Math.abs(diferenciaTecnicoVsMalas) < 0.0001
                    ? "✅ Coincide con PUNTAJE TECNICO."
                    : diferenciaTecnicoVsMalas > 0
                        ? `⚠️ Faltan ${diferenciaTecnicoVsMalas} puntos para PUNTAJE TECNICO.`
                        : `⚠️ Supera PUNTAJE TECNICO por ${Math.abs(diferenciaTecnicoVsMalas)} puntos.`;

                const diferenciaConTecnico = puntajePotencialPersona - puntajeTecnico;

                htmlComparacionTecnico = `
                    <details class="resultado-seccion">
                        <summary>Resumen y comparación de puntajes</summary>
                        <div class="seccion-contenido">
                        <b>Nombre:</b> ${registro.NOMBRE || nombreTecnico}

                        <div style="margin-top:10px;padding:12px;background:#eef6ff;border:1px solid #c9dff5;border-radius:8px;">
                            <b>1. Puntaje calculado + puntaje de descripciones sin pregunta</b><br><br>
                            Puntaje calculado: <b>${puntajeTotalObtenido}</b> puntos<br>
                            Descripciones sin pregunta: <b>+${puntosSinPregunta}</b> puntos<br>
                            <div style="margin-top:8px;padding:9px;background:#fff;border:1px solid #c9dff5;border-radius:7px;">
                                <b>Total: ${puntajePotencialPersona} puntos</b>
                            </div>
                            <span style="display:block;margin-top:6px;font-size:13px;color:#555;">
                                Suma del puntaje que obtuvo en la evaluación más las actividades asignadas con 1 en PTACTUAL que no tienen pregunta.
                            </span>
                        </div>

                        <div style="margin-top:10px;padding:12px;background:#f8fafc;border:1px solid #d9dee5;border-radius:8px;">
                            <b>2. Comparación de las respuestas malas</b><br><br>
                            <b>Puntaje de las respuestas malas:</b> +${puntosDeLasMalas} puntos
                            <div style="margin-top:8px;padding:10px;background:#fff;border:1px solid #d9dee5;border-radius:7px;">
                                <b>Simulación: Total + Puntaje de las respuestas malas</b><br>
                                Total (${puntajePotencialPersona}) + Puntaje de las respuestas malas (${puntosDeLasMalas}) = <b>${comparacionRespuestasMalas} puntos</b>
                            </div>
                            <div style="margin-top:8px;padding:10px;background:#fff;border:1px solid #d9dee5;border-radius:7px;">
                                <b>Resta final</b><br>
                                PUNTAJE TECNICO (${puntajeTecnico}) - Total simulado (${comparacionRespuestasMalas}) = <b>${diferenciaTecnicoVsMalas} puntos</b>
                            </div>
                            <span style="display:block;margin-top:6px;font-size:13px;color:#555;">
                                Esta simulación muestra cuánto tendría si los puntos de las respuestas malas se convirtieran en puntos buenos.
                            </span>
                            <div style="margin-top:8px;font-weight:600;">${estadoComparacionMalas}</div>
                        </div>

                        <div style="margin-top:10px;padding:12px;background:#fff;border:1px solid #ddd;border-radius:8px;">
                            <b>PUNTAJE TECNICO:</b> ${puntajeTecnico} puntos
                        </div>
                        </div>
                    </details>`;
            } else {
                htmlComparacionTecnico = `
                    <div style="margin-top:15px;padding:12px;background:#fff;border:1px solid #ddd;border-radius:8px;">
                        <b>Comparación con Datos_personales</b><br>
                        No se encontró el técnico <b>${nombreTecnico}</b> en Datos_personales.
                    </div>`;
            }
        }
    } catch(errorComparacion){
        console.error("Error comparando Datos_personales:", errorComparacion);
        htmlComparacionTecnico = `
            <div style="margin-top:15px;padding:12px;background:#fff;border:1px solid #ddd;border-radius:8px;">
                <b>Comparación con Datos_personales</b><br>
                Error al consultar PUNTAJE TECNICO.
            </div>`;
    }

    htmlComponentes += `
                </tbody>
            </table>

            <div style="margin-top:15px;padding:12px;background:#f9fafb;border:1px solid #ddd;border-radius:8px;">
                <b>Puntaje total: ${puntajeTotalObtenido} de ${puntajeTotalPosible}</b><br>
                <b>Calificación total por puntos: ${porcentajePuntosTotal.toFixed(1)}%</b>
            </div>
                </div>
            </details>

            ${htmlTareasMenos60}

            ${htmlSinPregunta}

            ${htmlComparacionTecnico}
        </div>
    `;

    // Preparar únicamente el resumen de mejora para la exportación.
    const actividadesExcel = [];

    ordenResumen.forEach(componente => {
        const grupo = resumenComponentes[componente];
        const porcentajeComponente =
            grupo.total > 0
                ? (grupo.buenas / grupo.total) * 100
                : 0;

        if(porcentajeComponente >= 60) return;

        Object.entries(actividadEvaluacion).forEach(([codigo, actividad]) => {
            if(actividad.componente !== componente) return;
            if(actividad.correctas >= actividad.totalPreguntas) return;

            const infoPT = puntosPorCodigoPT[codigo];
            if(!infoPT) return;

            const registroPT = (datosPTActual || []).find(r =>
                String(r["Codigo RH"] || "").trim() === codigo
            );

            actividadesExcel.push({
                tipo: "Mejorar",
                componente,
                codigo,
                descripcion: String(
                    registroPT?.["Descripcion de Tarea"] || ""
                ).trim(),
                correctas: actividad.correctas,
                preguntas: actividad.totalPreguntas,
                puntos: infoPT.puntaje,
                motivo: "Tiene respuestas incorrectas o incompletas."
            });
        });
    });


    resumenMejoraExcel = {
        nombre: nombrePersonaPT || "Sin nombre",
        fecha: new Date().toLocaleString("es-MX"),
        calificacion: porcentaje,
        correctas,
        incorrectas,
        actividades: actividadesExcel
    };

    document.getElementById("resultado").innerHTML = `

        <div class="card">
            <h3>Resultado Final</h3>

            <div class="resultado-resumen">
                <div class="resumen-metrica">
                    <span class="etiqueta">Respuestas correctas</span>
                    <span class="valor">✅ ${correctas}</span>
                </div>
                <div class="resumen-metrica">
                    <span class="etiqueta">Respuestas incorrectas</span>
                    <span class="valor">❌ ${incorrectas}</span>
                </div>
                <div class="resumen-metrica">
                    <span class="etiqueta">Calificación</span>
                    <span class="valor">${porcentaje}%</span>
                </div>
            </div>

            <div class="seccion-ayuda">Selecciona qué información quieres revisar. Las preguntas y respuestas están ocultas por defecto; abre el componente que quieras revisar.</div>
            <div class="resultado-controles">
                <button type="button" onclick="document.querySelectorAll('#resultado details').forEach(d=>d.open=true)">Mostrar todo</button>
                <button type="button" onclick="document.querySelectorAll('#resultado details').forEach(d=>d.open=false)">Ocultar todo</button>
                <button type="button" onclick="exportarResumenMejoraExcel()">📊 Generar Excel de mejora</button>
            </div>
        </div>

        ${htmlComponentes}

    `;
}


// =====================================
// EXPORTAR RESUMEN DE MEJORA A EXCEL
// Solo utiliza la información generada al calcular.
// =====================================
let resumenMejoraExcel = {
    nombre: "",
    fecha: "",
    calificacion: "",
    correctas: 0,
    incorrectas: 0,
    actividades: []
};

function exportarResumenMejoraExcel(){
    if(typeof XLSX === "undefined"){
        alert("No se pudo cargar el generador de Excel. Verifica la conexión a internet.");
        return;
    }

    const datos = resumenMejoraExcel;

    if(!datos.nombre){
        alert("Primero selecciona una persona y calcula el resultado.");
        return;
    }

    const resumen = [
        ["RESUMEN DE NECESIDADES DE MEJORA"],
        [],
        ["Técnico", datos.nombre],
        ["Fecha", datos.fecha],
        ["Calificación general", datos.calificacion + "%"],
        ["Respuestas correctas", datos.correctas],
        ["Respuestas incorrectas", datos.incorrectas],
        [],
        ["Tipo", "Componente", "Código RH", "Actividad / Descripción",
         "Preguntas correctas", "Preguntas totales", "Puntos de actividad", "Motivo"]
    ];

    datos.actividades.forEach(a => {
        resumen.push([
            a.tipo, a.componente, a.codigo, a.descripcion,
            a.correctas, a.preguntas, a.puntos, a.motivo
        ]);
    });

    if(datos.actividades.length === 0){
        resumen.push([
            "Sin pendientes", "", "",
            "No se detectaron actividades pendientes de mejora.",
            "", "", "", ""
        ]);
    }

    const ws = XLSX.utils.aoa_to_sheet(resumen);
    ws["!cols"] = [
        {wch:18},{wch:20},{wch:15},{wch:60},
        {wch:20},{wch:18},{wch:20},{wch:42}
    ];

    // Formato visual del Excel: solo presentación, sin cambiar los datos.
    // Se utiliza XLSX con soporte de estilos para conservar el contenido y mejorar únicamente la presentación.
    const borde = {
        top: { style: "thin", color: { rgb: "D9E2F3" } },
        bottom: { style: "thin", color: { rgb: "D9E2F3" } },
        left: { style: "thin", color: { rgb: "D9E2F3" } },
        right: { style: "thin", color: { rgb: "D9E2F3" } }
    };

    const estiloTitulo = {
        font: { name: "Calibri", sz: 16, bold: true, color: { rgb: "FFFFFF" } },
        fill: { fgColor: { rgb: "1F4E78" } },
        alignment: { horizontal: "center", vertical: "center" },
        border: borde
    };
    const estiloEncabezado = {
        font: { name: "Calibri", sz: 11, bold: true, color: { rgb: "FFFFFF" } },
        fill: { fgColor: { rgb: "4472C4" } },
        alignment: { horizontal: "center", vertical: "center", wrapText: true },
        border: borde
    };
    const estiloEtiqueta = {
        font: { name: "Calibri", sz: 11, bold: true, color: { rgb: "1F1F1F" } },
        fill: { fgColor: { rgb: "D9EAF7" } },
        alignment: { vertical: "center" },
        border: borde
    };
    const estiloDato = {
        font: { name: "Calibri", sz: 11, color: { rgb: "1F1F1F" } },
        fill: { fgColor: { rgb: "FFFFFF" } },
        alignment: { vertical: "center", wrapText: true },
        border: borde
    };
    const estiloDatoAlterno = {
        font: { name: "Calibri", sz: 11, color: { rgb: "1F1F1F" } },
        fill: { fgColor: { rgb: "F4F7FB" } },
        alignment: { vertical: "center", wrapText: true },
        border: borde
    };
    const estiloNumero = {
        font: { name: "Calibri", sz: 11, color: { rgb: "1F1F1F" } },
        alignment: { horizontal: "center", vertical: "center" },
        border: borde
    };
    const estiloNumeroAlterno = {
        font: { name: "Calibri", sz: 11, color: { rgb: "1F1F1F" } },
        fill: { fgColor: { rgb: "F4F7FB" } },
        alignment: { horizontal: "center", vertical: "center" },
        border: borde
    };

    ws["!cols"] = [
        { wch: 14 }, { wch: 20 }, { wch: 15 }, { wch: 58 },
        { wch: 18 }, { wch: 18 }, { wch: 18 }, { wch: 40 }
    ];
    ws["!merges"] = [
        { s: { r: 0, c: 0 }, e: { r: 0, c: 7 } }
    ];
    ws["!freeze"] = { xSplit: 0, ySplit: 9 };
    ws["!autofilter"] = { ref: `A9:H${Math.max(9, resumen.length)}` };
    ws["!rows"] = [
        { hpt: 30 }, { hpt: 8 }, { hpt: 22 }, { hpt: 22 },
        { hpt: 22 }, { hpt: 22 }, { hpt: 22 }, { hpt: 8 }, { hpt: 34 }
    ];

    if(ws["A1"]) ws["A1"].s = estiloTitulo;
    for(let r = 2; r <= 7; r++){
        if(ws[`A${r}`]) ws[`A${r}`].s = estiloEtiqueta;
        if(ws[`B${r}`]) ws[`B${r}`].s = estiloDato;
    }
    for(let c = 0; c < 8; c++){
        const cell = XLSX.utils.encode_cell({ r: 8, c });
        if(ws[cell]) ws[cell].s = estiloEncabezado;
    }
    for(let r = 9; r < resumen.length; r++){
        const alterno = (r % 2 === 0);
        for(let c = 0; c < 8; c++){
            const cell = XLSX.utils.encode_cell({ r, c });
            if(!ws[cell]) continue;
            if(c >= 4 && c <= 6){
                ws[cell].s = alterno ? estiloNumeroAlterno : estiloNumero;
            } else {
                ws[cell].s = alterno ? estiloDatoAlterno : estiloDato;
            }
        }
    }

    // Resaltar visualmente la calificación sin alterar su valor.
    if(ws["B5"]){
        ws["B5"].s = {
            font: { name: "Calibri", sz: 12, bold: true, color: { rgb: "1F4E78" } },
            fill: { fgColor: { rgb: "E2F0D9" } },
            alignment: { horizontal: "center", vertical: "center" },
            border: borde
        };
    }

    const porComponente = {};
    datos.actividades.forEach(a => {
        if(!porComponente[a.componente]){
            porComponente[a.componente] = {
                mejorar: 0,
                aprender: 0,
                puntos: 0
            };
        }

        if(a.tipo === "Mejorar") porComponente[a.componente].mejorar++;
        if(a.tipo === "Aprender") porComponente[a.componente].aprender++;
        porComponente[a.componente].puntos += Number(a.puntos || 0);
    });

    const resumenComponentes = [
        ["RESUMEN POR COMPONENTE"],
        [],
        ["Componente", "Actividades a mejorar", "Puntos relacionados"]
    ];

    Object.entries(porComponente).forEach(([componente, v]) => {
        resumenComponentes.push([
            componente, v.mejorar, v.puntos
        ]);
    });

    if(Object.keys(porComponente).length === 0){
        resumenComponentes.push(["Sin pendientes", 0, 0, 0]);
    }

    const wsComponentes = XLSX.utils.aoa_to_sheet(resumenComponentes);
    wsComponentes["!cols"] = [
        { wch: 28 }, { wch: 24 }, { wch: 20 }
    ];

    wsComponentes["!merges"] = [
        { s: { r: 0, c: 0 }, e: { r: 0, c: 2 } }
    ];
    wsComponentes["!freeze"] = { xSplit: 0, ySplit: 3 };
    wsComponentes["!autofilter"] = { ref: `A3:C${Math.max(3, resumenComponentes.length)}` };
    wsComponentes["!rows"] = [{ hpt: 30 }, { hpt: 8 }, { hpt: 34 }];

    if(wsComponentes["A1"]) wsComponentes["A1"].s = estiloTitulo;
    for(let c = 0; c < 3; c++){
        const cell = XLSX.utils.encode_cell({ r: 2, c });
        if(wsComponentes[cell]) wsComponentes[cell].s = estiloEncabezado;
    }
    for(let r = 3; r < resumenComponentes.length; r++){
        const alterno = (r % 2 === 0);
        for(let c = 0; c < 3; c++){
            const cell = XLSX.utils.encode_cell({ r, c });
            if(!wsComponentes[cell]) continue;
            if(c >= 1){
                wsComponentes[cell].s = alterno ? estiloNumeroAlterno : estiloNumero;
            } else {
                wsComponentes[cell].s = alterno ? estiloDatoAlterno : estiloDato;
            }
        }
    }

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Necesidades de mejora");
    XLSX.utils.book_append_sheet(wb, wsComponentes, "Por componente");

    const nombreArchivo = "Resumen_Mejora_" +
        datos.nombre
            .replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ _-]/g, "")
            .trim()
            .replace(/\s+/g, "_") +
        ".xlsx";

    XLSX.writeFile(wb, nombreArchivo);
}

// =====================================
// EVENTOS
// =====================================

document
.getElementById("selectUsuario")
.addEventListener(
    "change",
    cargarIntentos
);

document
.getElementById("selectIntento")
.addEventListener(
    "change",
    cargarPreguntas
);

// =====================================

cargarUsuarios();

</script>

</body>
</html>
